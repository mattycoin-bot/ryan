<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ryan's Shitcoin Pick</title>
<style>
  body{margin:0;background:radial-gradient(circle,#1a1200,#000);height:100vh;overflow:hidden;font-family:sans-serif}
  video{position:fixed;inset:0;width:100%;height:100%;background:#000;display:none;z-index:5}
  .coin{position:fixed;top:-60px;font-size:40px;animation:fall linear infinite}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
  #tap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
       text-align:center;cursor:pointer;padding:20px;z-index:2}
  h1{font-size:34px;margin:0;color:#ffd700;text-shadow:0 0 10px #ffae00,0 0 25px #ff8c00;animation:pulse 1s infinite alternate}
  @keyframes pulse{to{transform:scale(1.08)}}
  .ticker{margin-top:20px;color:#0f0;font:bold 22px monospace}
  .btn{margin-top:25px;padding:15px 30px;border-radius:40px;background:linear-gradient(#ffe066,#d4a000);
       color:#000;font-weight:bold;font-size:22px;box-shadow:0 0 20px #ffd700}
</style>
</head>
<body>
<div id="tap">
  <h1>🚀 Ryan's Shitcoin Pick of the Week 🚀</h1>
  <div class="ticker">RYANCOIN ▲ +42,069% 📈</div>
  <div class="btn">💰 Click to view 💰</div>
</div>
<video id="v" src="videomp4-001.mp4" loop playsinline preload="auto"></video>
<script>
  var e=['🪙','💰','🚀','🐕','💎','🌕','💸'];
  for(var i=0;i<30;i++){var c=document.createElement('div');c.className='coin';
    c.textContent=e[i%e.length];c.style.left=Math.random()*100+'vw';
    c.style.animationDuration=(3+Math.random()*5)+'s';c.style.animationDelay=(-Math.random()*8)+'s';
    document.body.appendChild(c);}
  document.getElementById('tap').onclick=function(){
    var v=document.getElementById('v');v.style.display='block';v.play();
  };
</script>
</body>
</html>
