<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ryan's Shitcoin Pick</title>
<style>
  body{margin:0;background:radial-gradient(circle,#1a1200,#000);height:100vh;overflow:hidden;font-family:sans-serif}
  video{position:fixed;inset:0;width:100%;height:100%;background:#000;display:none;z-index:5}
  .coin{position:fixed;top:-60px;font-size:40px;animation:fall linear infinite}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
       text-align:center;padding:20px;z-index:2}
  #tap{cursor:pointer}
  #load{display:none;background:rgba(0,0,0,.9);z-index:4}
  h1{font-size:34px;margin:0;color:#ffd700;text-shadow:0 0 10px #ffae00,0 0 25px #ff8c00;animation:pulse 1s infinite alternate}
  @keyframes pulse{to{transform:scale(1.08)}}
  .ticker{margin-top:20px;color:#0f0;font:bold 22px monospace}
  .btn{margin-top:25px;padding:15px 30px;border-radius:40px;background:linear-gradient(#ffe066,#d4a000);
       color:#000;font-weight:bold;font-size:22px;box-shadow:0 0 20px #ffd700}
  .spin{font-size:70px;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotateY(360deg)}}
  #title{color:#ffd700;font-size:24px;font-weight:bold;margin-top:10px}
  #years{margin-top:15px;font:bold 24px monospace;color:#0f0;text-shadow:0 0 8px #0f0;min-height:190px}
  #years div{animation:pop .4s}
  @keyframes pop{from{transform:scale(1.6);opacity:0}}
  #msg{color:#fff;font-size:22px;margin-top:10px}
</style>
</head>
<body>
  <div id="ticker" style="position:fixed;top:0;left:0;width:100%;background:#111;color:#0f0;font:14px monospace;padding:4px 0;overflow:hidden;white-space:nowrap;z-index:999">
  <span id="tickerText" style="display:inline-block;padding-left:100%;animation:scroll 25s linear infinite"></span>
</div>
<style>@keyframes scroll{to{transform:translateX(-100%)}} body{padding-top:28px}</style>
<script>
  const now = new Date(), start = new Date(now);
  start.setDate(now.getDate() - now.getDay());
  const end = new Date(start); end.setDate(start.getDate() + 6);
  const f = d => d.toLocaleDateString('en-US', {month:'short', day:'numeric'});
  const coins = ['RYANCOIN ▲ 420%', 'MOONDOGE ▼ 98%', 'RUGPULL ▲ 1337%', 'HODLR ▼ 69%'];
  document.getElementById('tickerText').textContent =
    `📈 BREAKING: Pick of the Week for ${f(start)} – ${f(end)}, ${end.getFullYear()}  •  ` + coins.join('  •  ');
</script>
<div id="tap" class="screen">
  <h1>🚀 Ryan's Shitcoin Pick of the Week 🚀</h1>
  <div class="ticker">RYANCOIN ▲ +42,069% 📈</div>
  <div class="btn">💰 Click to view 💰</div>
</div>
<div id="load" class="screen">
  <div class="spin">🪙</div>
  <div id="title">RYANCOIN PRICE HISTORY</div>
  <div id="years"></div>
  <div id="msg">Loading...</div>
</div>
<video id="v" loop playsinline preload="none"></video>
<script>
  var e=['🪙','💰','🚀','🐕','💎','🌕','💸'];
  for(var i=0;i<30;i++){var c=document.createElement('div');c.className='coin';
    c.textContent=e[i%e.length];c.style.left=Math.random()*100+'vw';
    c.style.animationDuration=(3+Math.random()*5)+'s';c.style.animationDelay=(-Math.random()*8)+'s';
    document.body.appendChild(c);}
  var v=document.getElementById('v'),ready=false,started=false,timers=[],minDone=false,shown=false;
  v.addEventListener('canplay',function(){ready=true;go();});
  function go(){
    if(shown||!started||!ready||!minDone)return;
    shown=true;
    timers.forEach(clearInterval);
    document.getElementById('load').style.display='none';
    v.style.display='block';v.currentTime=0;v.muted=false;
    var p=v.play();
    if(p&&p.catch)p.catch(function(){v.controls=true;});
  }
  function money(n){return '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
  document.getElementById('tap').onclick=function(){
    this.style.display='none';
    document.getElementById('load').style.display='flex';
    v.src='videomp4-001.mp4';v.muted=true;
    var p=v.play();
    if(p&&p.then)p.then(function(){if(!shown)v.pause();}).catch(function(){});
    var thisYear=new Date().getFullYear();
    var year=thisYear-4,price=0.01,box=document.getElementById('years');
    function addYear(){
      var label=year>thisYear?year+' (projected)':year;
      var d=document.createElement('div');d.textContent=label+'  '+money(price)+' ▲';
      box.appendChild(d);
      while(box.children.length>5)box.removeChild(box.firstChild);
      year++;price*=(8+Math.random()*12);
    }
    addYear();
    timers.push(setInterval(addYear,1000));
    var msgs=['Loading...','Waiting...','Waiting...','Optimizing...','Loading...','To the moon... 🚀'],m=0;
    timers.push(setInterval(function(){m=(m+1)%msgs.length;
      document.getElementById('msg').textContent=msgs[m];},1100));
    setTimeout(function(){minDone=true;go();},5000);
    started=true;go();
  };
</script>
</body>
</html>
